name: 每日简报自动生成

on:
  schedule:
    - cron: '0 2 * * *'        # UTC 02:00 = 北京时间 10:00
  workflow_dispatch:          # 允许在 Actions 页面手动触发测试

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q requests feedparser

      - name: Generate briefs (6 方向)
        run: |
          for t in finance ai ai_apps newenergy entertainment semiconductor; do
            python scripts/generate_brief.py --type "$t"
          done

      - name: Update index & archive
        run: |
          python scripts/update_index.py
          TODAY=$(date +%Y-%m-%d)
          declare -A M=( [finance]=finance.html [ai]=ai.html [ai_apps]=ai-apps.html [newenergy]=newenergy.html [entertainment]=entertainment.html [semiconductor]=semiconductor.html )
          for t in "${!M[@]}"; do
            cp "${M[$t]}" "archive/${t}-${TODAY}.html"
          done

      - name: Commit & push
        run: |
          git config user.name "xxy20010606"
          git config user.email "xxy20010606@users.noreply.github.com"
          git add -A
          git commit -m "每日简报自动更新 - $(date +%Y-%m-%d)" || echo "无变化，跳过"
          git push
