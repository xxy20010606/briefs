<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>历史简报 - 每日简报中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1a1a2e;color:#eee;min-height:100vh}
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);padding:24px 20px 20px;text-align:center}
.header-row{display:flex;align-items:center;justify-content:center;gap:10px}
.header-icon{font-size:22px}
.header-title{font-size:22px;font-weight:700;letter-spacing:1px}
.header-sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:6px}
.back-link{display:inline-block;margin-top:10px;color:rgba(255,255,255,.8);font-size:13px;text-decoration:none;border-bottom:1px dotted rgba(255,255,255,.5)}
.back-link:active{opacity:.7}
.section{max-width:480px;margin:0 auto;padding:16px}
.day-card{background:#16213e;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.06)}
.day-date{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.day-week{font-size:11px;color:#888;font-weight:400;background:rgba(255,255,255,.08);padding:2px 8px;border-radius:8px}
.day-tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;text-decoration:none;color:#fff;transition:opacity .15s}
.tag:active{opacity:.7}
.tag-emoji{font-size:14px}
.t-fin{background:linear-gradient(135deg,#ef4444,#dc2626)}
.t-ai{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.t-apps{background:linear-gradient(135deg,#22c55e,#16a34a)}
.t-energy{background:linear-gradient(135deg,#f97316,#ea580c)}
.t-fun{background:linear-gradient(135deg,#ec4899,#db2777)}
.t-chip{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.empty{text-align:center;color:#555;font-size:14px;padding:40px 20px}
.footer{text-align:center;padding:16px;font-size:11px;color:#555}
</style>
</head>
<body>
<div class="header">
<div class="header-row">
<span class="header-icon">📂</span>
<span class="header-title">历史简报</span>
</div>
<div class="header-sub">保留最近 7 天 · 点击分类查看当日归档</div>
<a class="back-link" href="index.html">← 返回首页</a>
</div>

<div class="section" id="list"></div>
<div class="footer">Powered by WorkBuddy AI · xxy20010606</div>

<script>
(function(){
var p=function(n){return(n<10?'0':'')+n};
var weeks=['日','一','二','三','四','五','六'];
var cats=[
{key:'finance',name:'财经',emoji:'📊',cls:'t-fin',abs:false},
{key:'ai',name:'AI产业',emoji:'🤖',cls:'t-ai',abs:false},
{key:'ai-apps',name:'AI应用',emoji:'🚀',cls:'t-apps',abs:false},
{key:'newenergy',name:'新能源',emoji:'⚡',cls:'t-energy',abs:false},
{key:'entertainment',name:'娱乐',emoji:'🎬',cls:'t-fun',abs:false},
{key:'semiconductor',name:'半导体',emoji:'💾',cls:'t-chip',abs:false}
];
var today=new Date();
var el=document.getElementById('list');
var html='';
for(var i=1;i<=7;i++){
  var d=new Date(today);
  d.setDate(today.getDate()-i);
  var y=d.getFullYear();
  var m=p(d.getMonth()+1);
  var day=p(d.getDate());
  var ds=y+'-'+m+'-'+day;
  var label=y+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
  var wk='周'+weeks[d.getDay()];
  html+='<div class="day-card">';
  html+='<div class="day-date">'+label+' <span class="day-week">'+wk+'</span></div>';
  html+='<div class="day-tags">';
  for(var j=0;j<cats.length;j++){
    var c=cats[j];
    var base=c.abs?'https://xxy20010606.github.io/daily/archive/':'archive/';
    html+='<a class="tag '+c.cls+'" href="'+base+c.key+'-'+ds+'.html?v='+Date.now()+'">';
    html+='<span class="tag-emoji">'+c.emoji+'</span>'+c.name;
    html+='</a>';
  }
  html+='</div></div>';
}
if(!html){html='<div class="empty">暂无历史简报</div>'}
el.innerHTML=html;
})();
</script>
</body>
</html>
